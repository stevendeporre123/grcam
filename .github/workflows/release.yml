name: Build & Release (Windows)

on:
  push:
    tags: ['v*']          # release bij een tag, bv. v0.1.0
  workflow_dispatch:       # handmatig bouwen (artifact, geen release)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: PTZ-Backup-windows
          path: dist/*.exe

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
