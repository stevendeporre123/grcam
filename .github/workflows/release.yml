name: Build & Release (Windows)

on:
  push:
    tags: ['v*']          # release bij een tag, bv. v0.1.0
  workflow_dispatch:       # handmatig bouwen (artifact, geen release)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # De versie van de .exe komt uit package.json. Die zetten we hier uit de tag (v0.2.0 -> 0.2.0);
      # zonder tag (handmatige run) wordt het <basis>-dev.<runnummer>.
      - name: Versie bepalen
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version.split('-')[0]")-dev.${GITHUB_RUN_NUMBER}"
          fi
          npm version "$V" --no-git-tag-version --allow-same-version
          echo "Versie: $V"

      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
      - run: npm run dist

      - uses: actions/upload-artifact@v7
        with:
          name: PTZ-Backup-windows-${{ github.ref_name }}-${{ github.run_number }}
          path: dist/*.exe

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
